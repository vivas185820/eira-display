plugins {
    id 'com.android.application'
}

android {
    namespace 'com.somoseira.display'
    compileSdk 35

    defaultConfig {
        applicationId "com.somoseira.display"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.2.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
