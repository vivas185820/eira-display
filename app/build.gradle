plugins {
    id 'com.android.application'
}

android {
    namespace 'com.somoseira.display.stable'
    compileSdk 35

    signingConfigs {
        release {
            def ks = System.getenv("EIRA_KEYSTORE_FILE")
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv("EIRA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("EIRA_KEY_ALIAS")
                keyPassword System.getenv("EIRA_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.somoseira.display.stable"
        minSdk 26
        targetSdk 35
        versionCode 1003000
        versionName "1.3.0-stable"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
